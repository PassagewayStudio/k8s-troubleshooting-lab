# Scenario 01: ImagePullBackOff (bad image tag)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-badimage
  namespace: lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-badimage
  template:
    metadata:
      labels:
        app: web-badimage
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-doesnotexist
          ports:
            - containerPort: 80
