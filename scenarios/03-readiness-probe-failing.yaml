# Scenario 03: failing readiness probe (pod Running but 0/1 Ready, Service has no endpoints)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-notready
  namespace: lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-notready
  template:
    metadata:
      labels:
        app: web-notready
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /  # nginx has no such path -> 404
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web-notready
  namespace: lab
spec:
  selector:
    app: web-notready
  ports:
    - port: 80
      targetPort: 80
